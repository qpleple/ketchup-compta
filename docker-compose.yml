services:
  web:
    build: .
    ports:
      - "8080:80"
    volumes:
      - ./www:/var/www/html
      - ./sql:/var/www/sql
      - ./tests:/var/tests
    environment:
      - SQLITE_DB=/var/www/html/data/compta.db
      # Test paths inside the container (./tests is mounted at /var/tests)
      - WWW_PATH=/var/www/html
      - APP_URL=http://localhost:80
