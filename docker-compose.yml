services:
  web:
    build: .
    ports:
      # Override if 8080 is taken: APP_PORT=8099 docker-compose up -d
      # APP_PORT=0 lets Docker pick any free port (handy when you only run tests)
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./www:/var/www/html
      - ./sql:/var/www/sql
      - ./tests:/var/tests
    environment:
      - SQLITE_DB=/var/www/html/data/compta.db
      # Test paths inside the container (./tests is mounted at /var/tests)
      - WWW_PATH=/var/www/html
      - APP_URL=http://localhost:80
